    channel:
      $ref: '#/channels/get_room_info'
    messages:
      - $ref: '#/channels/get_room_info/messages/getRoomInfoMessage'
  roomInfo:
    action: receive
    channel:
      $ref: '#/channels/get_room_info'
    messages:
      - $ref: '#/channels/get_room_info/messages/roomInfo'
  updateConfig:
    action: send
    channel:
      $ref: '#/channels/update_config'
    messages:
      - $ref: '#/channels/update_config/messages/updateConfigMessage'
  startGame:
    action: send
    channel:
      $ref: '#/channels/start_game'
    messages:
      - $ref: '#/channels/start_game/messages/startGameMessage'
  getLeaderboard:
    action: send
    channel:
      $ref: '#/channels/get_leaderboard'
    messages:
      - $ref: '#/channels/get_leaderboard/messages/getLeaderboardMessage'
  updateLeaderboard:
    action: receive
    channel:
      $ref: '#/channels/get_leaderboard'
    messages:
      - $ref: '#/channels/get_leaderboard/messages/updateLeaderboard'
  checkClueAnswer:
    action: send
    channel:
      $ref: '#/channels/check_clue_answer'
    messages:
      - $ref: '#/channels/check_clue_answer/messages/checkClueAnswer'
  loadGameComponent:
    action: receive
    channel:
      $ref: '#/channels/load_game_component'
    messages:
      - $ref: '#/channels/load_game_component/messages/loadGameComponent'
  gameStarted:
    action: receive
    channel:
      $ref: '#/channels/game_started'
    messages:
      - $ref: '#/channels/game_started/messages/gameStarted'
  getQuestionData:
    action: receive
    channel:
      $ref: '#/channels/get_question_data'
    messages:
      - $ref: '#/channels/get_question_data/messages/getQuestionData'
  updateTimer:
    action: receive
    channel:
      $ref: '#/channels/update_timer'
    messages:
      - $ref: '#/channels/update_timer/messages/updateTimer'
  getScore:
    action: receive
    channel:
      $ref: '#/channels/get_score'
    messages:
      - $ref: '#/channels/get_score/messages/getScore'
  scoreUpdate:
    action: receive
    channel:
      $ref: '#/channels/score_update'
    messages:
      - $ref: '#/channels/score_update/messages/scoreUpdate'
  clearFieldNewWord:
    action: receive
    channel:
      $ref: '#/channels/clear_field_new_word'
    messages:
      - $ref: '#/channels/clear_field_new_word/messages/clearFieldNewWord'
  gameRestart:
    action: receive
    channel:
      $ref: '#/channels/game_restart'
    messages:
      - $ref: '#/channels/game_restart/messages/gameRestart'
  nextWordIn:
    action: receive
    channel:
      $ref: '#/channels/next_word_in'
    messages:
      - $ref: '#/channels/next_word_in/messages/nextWordIn'
  endGame:
    action: receive
    channel:
      $ref: '#/channels/end_game'
    messages:
      - $ref: '#/channels/end_game/messages/endGame'
  playerJoined:
    action: receive
    channel:
      $ref: '#/channels/player_joined'
    messages:
      - $ref: '#/channels/player_joined/messages/playerJoined'
  playerLeft:
    action: receive
    channel:
      $ref: '#/channels/player_left'
    messages:
      - $ref: '#/channels/player_left/messages/playerLeft'
  becameAdmin:
    action: receive
    channel:
      $ref: '#/channels/became_admin'
    messages:
      - $ref: '#/channels/became_admin/messages/becameAdmin'
  sendChatMessage:
    action: send
    channel:
      $ref: '#/channels/chat_message'
    messages:
      - $ref: '#/channels/chat_message/messages/sendMessage'
  receiveChatMessage:
    action: receive
    channel:
      $ref: '#/channels/chat_message'

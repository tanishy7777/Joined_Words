  sendFriendRequest:
    action: send
    channel:
      $ref: '#/channels/send_friend_request'
    messages:
      - $ref: '#/channels/send_friend_request/messages/sendFriendRequest'
  sendFriendRequestResponse:
    action: receive
    channel:
      $ref: '#/channels/send_friend_request'
    messages:
      - $ref: '#/channels/send_friend_request/messages/sendFriendRequestResponse'
  getFriendRequests:
    action: send
    channel:
      $ref: '#/channels/get_friend_requests'
    messages:
      - $ref: '#/channels/get_friend_requests/messages/getFriendRequests'
  friendRequests:
    action: receive
    channel:
      $ref: '#/channels/get_friend_requests'
    messages:
      - $ref: '#/channels/get_friend_requests/messages/friendRequests'
  respondFriendRequest:
    action: send
    channel:
      $ref: '#/channels/respond_friend_request'
    messages:
      - $ref: '#/channels/respond_friend_request/messages/respondFriendRequest'
  respondFriendRequestResponse:
    action: receive
    channel:
      $ref: '#/channels/respond_friend_request'
    messages:
      - $ref: >-
          #/channels/respond_friend_request/messages/respondFriendRequestResponse
  getFriends:
    action: send
    channel:
      $ref: '#/channels/get_friends'
    messages:
      - $ref: '#/channels/get_friends/messages/getFriends'
  friendsList:
    action: receive
    channel:
      $ref: '#/channels/get_friends'
    messages:
      - $ref: '#/channels/get_friends/messages/friendsList'
  inviteFriend:
    action: send
    channel:
      $ref: '#/channels/invite_friend_to_game'
    messages:
      - $ref: '#/channels/invite_friend_to_game/messages/inviteFriend'
